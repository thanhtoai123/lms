name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satarobo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/satarobo
      DEV_ACTOR_EMAIL: teacher1@satarobo.vn
      ALLOW_DEV_ACTOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Build core
        run: pnpm --filter @satarobo/core build
      - name: Unit tests (core)
        run: pnpm --filter @satarobo/core test
      - name: Typecheck all packages
        run: pnpm -r typecheck
      - name: DB push (drizzle-kit)
        run: set -o pipefail; pnpm --filter @satarobo/db exec drizzle-kit push --force 2>&1 | tee /tmp/ci-1-push.log
      - name: DB constraints (SQL)
        run: set -o pipefail; pnpm db:apply-sql 2>&1 | tee /tmp/ci-2-sql.log
      - name: DB seed
        run: set -o pipefail; pnpm db:seed 2>&1 | tee /tmp/ci-3-seed.log
      - name: Build web
        run: set -o pipefail; pnpm --filter @satarobo/web build 2>&1 | tee /tmp/ci-4-build.log
      - name: Smoke test (server renders Teacher app with seeded data)
        run: |
          (cd apps/web && pnpm start -p 3000 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 1; done
          curl -sf -b "x-dev-actor=teacher1@satarobo.vn" http://localhost:3000/teacher | grep -q "Hôm nay"
          curl -sf -b "x-dev-actor=manager.cs1@example.test" http://localhost:3000/ops | grep -q "Việc cần xử lý"
          echo "smoke OK"
      - name: Report failure as GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; for f in /tmp/ci-*.log; do [ -f "$f" ] || continue; echo "### $f"; echo '```'; tail -c 5000 "$f"; echo '```'; done; } > /tmp/body.md
          gh issue create --title "CI failed: ${{ github.sha }}" --body-file /tmp/body.md || true
