name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satarobo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/satarobo
      DEV_ACTOR_EMAIL: teacher1@satarobo.vn
      ALLOW_DEV_ACTOR: "1"
      SEPAY_API_KEY: ci-sepay-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Build core
        run: pnpm --filter @satarobo/core build
      - name: Unit tests (core)
        run: pnpm --filter @satarobo/core test
      - name: Typecheck all packages
        run: pnpm -r typecheck
      - name: DB push (drizzle-kit)
        run: set -o pipefail; pnpm --filter @satarobo/db exec drizzle-kit push --force 2>&1 | tee /tmp/ci-1-push.log
      - name: DB constraints (SQL)
        run: set -o pipefail; pnpm db:apply-sql 2>&1 | tee /tmp/ci-2-sql.log
      - name: DB seed
        run: set -o pipefail; pnpm db:seed 2>&1 | tee /tmp/ci-3-seed.log
      - name: Build web
        run: set -o pipefail; pnpm --filter @satarobo/web build 2>&1 | tee /tmp/ci-4-build.log
      - name: Smoke test (server renders Teacher app with seeded data)
        run: |
          (cd apps/web && pnpm start -p 3000 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 1; done
          curl -sf -b "x-dev-actor=teacher1@satarobo.vn" http://localhost:3000/teacher | grep -q "Hôm nay"
          M="x-dev-actor=manager.cs1@example.test"; A="x-dev-actor=superadmin@example.test"
          curl -sf -b "$M" http://localhost:3000/dashboard | grep -q "CẦN XỬ LÝ\|Cần xử lý"
          curl -sf -b "$A" http://localhost:3000/dashboard | grep -q "Báo cáo Lead"   # sidebar đủ nhóm cho Super Admin
          for p in /crm /leads "/leads?view=kanban" /nhap-khach-hang /leads/bulk-convert /quan-ly-chia-lead /ban-giao-lead /lead-nguoi /leads/bao-cao-chuyen /classes /sessions /cham-soc-hv /cau-hinh-van-hanh; do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000$p" || { echo "FAIL $p"; exit 1; }
          done
          for p in /students /students/new /students/tai-khoan /students/sap-het-khoa /enrollments /enrollments/new /chuyen-lop /centers /rooms /lich /attendance /hoc-bu "/hoc-bu?status=requested" /canh-bao-rui-ro /hoc-ba /report-cards /report-cards/criteria /hoan-thanh-khoa /media /duyet-media; do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000$p" || { echo "FAIL $p"; exit 1; }
          done
          for p in "/classes?status=pending_approval" /classes/new /teachers /courses /course-prerequisites /curriculums /centers/ngay-nghi; do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000$p" || { echo "FAIL $p"; exit 1; }
          done
          for CID in $(curl -s -b "$M" "http://localhost:3000/api/trpc/academics.classes.list" | grep -o '"id":"[0-9a-f-]\{36\}","code"' | cut -d'"' -f4); do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000/classes/$CID" || { echo "FAIL class $CID"; exit 1; }
          done
          curl -sf -b "$M" "http://localhost:3000/classes?status=pending_approval" | grep -q "Chờ duyệt"
          for TID in $(curl -s -b "$M" "http://localhost:3000/api/trpc/catalog.teachers" | grep -o '"id":"[0-9a-f-]\{36\}","code"' | cut -d'"' -f4); do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000/teachers/$TID" || { echo "FAIL teacher $TID"; exit 1; }
          done
          for CUR in $(curl -s -b "$A" "http://localhost:3000/api/trpc/catalog.curricula" | grep -o '"id":"[0-9a-f-]\{36\}","name"' | cut -d'"' -f4); do
            curl -sf -o /dev/null -b "$A" "http://localhost:3000/curriculums/$CUR" || { echo "FAIL curriculum $CUR"; exit 1; }
          done
          for p in /lop-trial "/lop-trial?status=attended" /bao-cao/lead /bao-cao/trial /bao-cao/dao-tao /bao-cao/hieu-suat-gv; do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000$p" || { echo "FAIL $p"; exit 1; }
          done
          for p in /users "/users?status=locked" /roles "/roles?role=TEACHER" /audit-log /bao-cao/lead; do
            curl -sf -o /dev/null -b "$A" "http://localhost:3000$p" || { echo "FAIL admin $p"; exit 1; }
          done
          curl -sf -b "$M" http://localhost:3000/lop-trial | grep -q "Lớp Trial"
          curl -sf -b "$M" http://localhost:3000/users | grep -q "chưa có quyền"   # quản lý cơ sở không xem được tài khoản
          UID1=$(curl -s -b "$A" "http://localhost:3000/api/trpc/system.users" | grep -o '"id":"[0-9a-f-]\{36\}"' | head -1 | cut -d'"' -f4)
          test -n "$UID1" && curl -sf -o /dev/null -b "$A" "http://localhost:3000/users/$UID1"
          SID=$(curl -s -b "$M" "http://localhost:3000/api/trpc/students.list" | grep -o '"id":"[0-9a-f-]\{36\}"' | head -1 | cut -d'"' -f4)
          test -n "$SID" && curl -sf -o /dev/null -b "$M" "http://localhost:3000/students/$SID" && curl -sf -o /dev/null -b "$M" "http://localhost:3000/students/$SID/edit"
          K="x-dev-actor=ketoan.cs1@example.test"
          for p in /orders /orders/new /payments "/payments?status=recorded" /cong-no /thieu-hoc-phi /hoan-tien /payment-methods; do
            curl -sf -o /dev/null -b "$K" "http://localhost:3000$p" || { echo "FAIL finance $p"; exit 1; }
            curl -sf -o /dev/null -b "$M" "http://localhost:3000$p" || { echo "FAIL finance(M) $p"; exit 1; }
          done
          for OID in $(curl -s -b "$K" "http://localhost:3000/api/trpc/finance.orders" | grep -o '"id":"[0-9a-f-]\{36\}","code"' | cut -d'"' -f4); do
            curl -sf -o /dev/null -b "$K" "http://localhost:3000/orders/$OID" || { echo "FAIL order $OID"; exit 1; }
          done
          PID=$(curl -s -b "$K" "http://localhost:3000/api/trpc/finance.payments?input=%7B%22status%22%3A%22confirmed%22%7D" | grep -o '"id":"[0-9a-f-]\{36\}","amount"' | head -1 | cut -d'"' -f4)
          test -n "$PID" && curl -sf -b "$K" "http://localhost:3000/payments/$PID/phieu-thu" | grep -q "PHIẾU THU"
          for p in /bien-dong-so-du "/bien-dong-so-du?status=needs_review" /nhap-giao-dich-cu /crm/commission "/crm/commission?tab=rules"; do
            curl -sf -o /dev/null -b "$K" "http://localhost:3000$p" || { echo "FAIL 4B $p"; exit 1; }
          done
          curl -sf -o /dev/null -b "$M" http://localhost:3000/crm/commission
          H="x-dev-actor=hr.cs1@example.test"
          for p in /nhan-su "/nhan-su?status=resigned" /nhan-su/new /nhan-su/vi-tri /cham-cong /cham-cong/phan-ca /cham-cong/lich-ca /don-tu "/don-tu?status=pending"; do
            curl -sf -o /dev/null -b "$H" "http://localhost:3000$p" || { echo "FAIL hr $p"; exit 1; }
          done
          for p in /nhan-su /cham-cong /don-tu /cham-cong/lich-ca; do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000$p" || { echo "FAIL hr(M) $p"; exit 1; }
          done
          curl -sf -o /dev/null -b "x-dev-actor=sale1.cs1@example.test" http://localhost:3000/cham-cong/lich-ca
          for p in /parent-requests "/parent-requests?status=all" /parent-feedback "/parent-feedback?low=1" /khao-sat /khao-sat/new /notifications "/notifications?status=failed" "/sinh-nhat?days=30"; do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000$p" || { echo "FAIL care $p"; exit 1; }
          done
          for RID in $(curl -s -b "$M" "http://localhost:3000/api/trpc/care.requests" | grep -o '"id":"[0-9a-f-]\{36\}","code":"YC' | cut -d'"' -f4); do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000/parent-requests/$RID" || { echo "FAIL preq $RID"; exit 1; }
          done
          for SVID in $(curl -s -b "$M" "http://localhost:3000/api/trpc/care.surveys" | grep -o '"id":"[0-9a-f-]\{36\}","title"' | cut -d'"' -f4); do
            curl -sf -o /dev/null -b "$M" "http://localhost:3000/khao-sat/$SVID" || { echo "FAIL survey $SVID"; exit 1; }
          done
          curl -sf http://localhost:3000/ks/khong-ton-tai-123 | grep -q "không đúng"   # trang khảo sát công khai
          for SID in $(curl -s -b "$H" "http://localhost:3000/api/trpc/hr.staff" | grep -o '"id":"[0-9a-f-]\{36\}","code":"NV' | cut -d'"' -f4); do
            curl -sf -o /dev/null -b "$H" "http://localhost:3000/nhan-su/$SID" || { echo "FAIL staff $SID"; exit 1; }
          done
          # Webhook SePay: sai khoá → 401; đúng khoá → nhận + chống trùng
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Apikey sai' -H 'Content-Type: application/json' -d '{}' http://localhost:3000/api/webhooks/sepay)" = "401"
          BODY='{"id":990001,"gateway":"Vietcombank","transactionDate":"2026-01-02 10:00:00","accountNumber":"0000000000","code":null,"content":"chuyen khoan thu","transferType":"in","transferAmount":100000,"accumulated":0,"subAccount":null,"referenceCode":"CI1","description":""}'
          curl -sf -X POST -H 'Authorization: Apikey ci-sepay-key' -H 'Content-Type: application/json' -d "$BODY" http://localhost:3000/api/webhooks/sepay | grep -q '"success":true'
          curl -sf -X POST -H 'Authorization: Apikey ci-sepay-key' -H 'Content-Type: application/json' -d "$BODY" http://localhost:3000/api/webhooks/sepay | grep -q '"duplicate":true'
          curl -sfL -o /dev/null -w '%{url_effective}' -b "$M" http://localhost:3000/ops | grep -q "/dashboard"   # đường dẫn cũ
          curl -sL http://localhost:3000/dashboard | grep -q "Đăng nhập quản trị"   # chưa đăng nhập → trang login
          echo "smoke OK"
      - name: Report failure as GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; for f in /tmp/ci-*.log; do [ -f "$f" ] || continue; echo "### $f"; echo '```'; tail -c 5000 "$f"; echo '```'; done; } > /tmp/body.md
          gh issue create --title "CI failed: ${{ github.sha }}" --body-file /tmp/body.md || true
